<script>
window.generateListHTML = function(items) {
  var dateStr = new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'});
  var dataJson = JSON.stringify(items);
  var css = [
    '*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}',

    + 'var BAKED=' + dataJson + ';'

    + '};'

    +   'if(cur==="all")return;'

// True on narrow (phone) viewports — lets layouts stack instead of overflow.
const useIsNarrow = (bp = 640) => {
  const [narrow, setNarrow] = useState(() => (typeof window !== 'undefined' ? window.innerWidth < bp : false));
  useEffect(() => {
    const on = () => setNarrow(window.innerWidth < bp);
    on();
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, [bp]);
  return narrow;
};

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const SUPABASE_URL     = 'https://pwxtcdutncsbnffvaszh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__l5FPA2OKH-sPI0TP0E4Xg_HxpGr9ni';
const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) ?? null;
if (!sb) console.warn('Supabase unavailable — app running in offline mode with default data');
const FAMILY_ID = 'stewarts';
let currentSessionId = null;

// Live data — starts as DEFAULT_D, updated after Supabase load completes
let D = DEFAULT_D;

// Populated by db.init() before first render; components read from here
const INIT = { todos: { chad: [], joelle: [] }, priorities: ['','',''], notes: [], upcomingNotes: ['','','','',''] };

const mergeD = (saved) => {
  if (!saved || !Object.keys(saved).length) return DEFAULT_D;
  const fixedBillsList = saved.fixedBillsList ?? DEFAULT_D.fixedBillsList;
  const fixedBills = fixedBillsList?.length
    ? Math.round(fixedBillsList.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0))
    : (saved.fixedBills ?? DEFAULT_D.fixedBills);
  return {
    ...DEFAULT_D, ...saved,
    date:         saved.date         ?? DEFAULT_D.date,
    cycle:        { ...DEFAULT_D.cycle, ...(saved.cycle || {}) },
    accounts:     { ...DEFAULT_D.accounts, ...(saved.accounts || {}) },
    income:       { total: saved.income?.total ?? DEFAULT_D.income.total, sources: saved.income?.sources ?? DEFAULT_D.income.sources },
    grocery:      { ...DEFAULT_D.grocery, ...(saved.grocery || {}) },
    transfers:    saved.transfers ?? DEFAULT_D.transfers,
    spending:     saved.spending     ?? DEFAULT_D.spending,
    fixedBillsList,
    fixedBills,
    variableSpend: saved.variableSpend ?? DEFAULT_D.variableSpend,
    deficit:      saved.deficit      ?? DEFAULT_D.deficit,
    goals:        saved.goals        ?? DEFAULT_D.goals,
  };
};

const db = {
  async init() {
    if (!sb) return;
    // Find open session or create one
    const { data: sessions } = await sb.from('sessions')
      .select().eq('family_id', FAMILY_ID).is('completed_at', null)
      .order('created_at', { ascending: false }).limit(1);
    let session = sessions?.[0];
    if (!session) {
      const { data } = await sb.from('sessions')
        .insert({ family_id: FAMILY_ID, session_date: new Date().toISOString().split('T')[0] })
        .select().single();
      session = data;
    }
    currentSessionId = session.id;

    const [budgetRes, todosRes, priRes, notesRes, upcomingRes] = await Promise.all([
      sb.from('budget_data').select('data').eq('family_id', FAMILY_ID).single(),
      sb.from('todos').select('*').eq('session_id', currentSessionId).order('sort_order'),
      sb.from('priorities').select('*').eq('session_id', currentSessionId).order('slot'),
      sb.from('notes').select('*').eq('session_id', currentSessionId).order('sort_order'),
      sb.from('upcoming_notes').select('*').eq('family_id', FAMILY_ID).order('slot'),
    ]);

    D = mergeD(budgetRes.data?.data);

    const allTodos = todosRes.data || [];
    const pris     = priRes.data   || [];
    const uNotes   = upcomingRes.data || [];

    Object.assign(INIT, {
      todos: {
        chad:   allTodos.filter(t => t.person === 'chad').map(t => ({ id: t.id, text: t.text, done: t.done, due_date: t.due_date, created_at: t.created_at })),
        joelle: allTodos.filter(t => t.person === 'joelle').map(t => ({ id: t.id, text: t.text, done: t.done, due_date: t.due_date, created_at: t.created_at })),
      },
      priorities:    [0,1,2].map(i => pris.find(p => p.slot === i+1)?.text ?? ''),
      notes:         (notesRes.data || []).map(n => ({ id: n.id, text: n.text, due_date: n.due_date, created_at: n.created_at })),
      upcomingNotes: [1,2,3,4,5].map(i => uNotes.find(u => u.slot === i)?.text ?? ''),
    });
  },

  async addTodo(person, text, sortOrder) {
    if (!sb) throw new Error('offline');
    const { data } = await sb.from('todos').insert({
      family_id: FAMILY_ID, session_id: currentSessionId,
      person, text, done: false, sort_order: sortOrder,
    }).select().single();
    return data;
  },
  toggleTodo(id, done) {
    if (!sb) return;
    sb.from('todos').update({ done, updated_at: new Date().toISOString() }).eq('id', id)
      .then(r => { if (r.error) console.error('toggleTodo failed:', r.error); });
  },
  updateTodo(id, text, dueDate) {
    if (!sb) return;
    sb.from('todos').update({ text, due_date: dueDate || null, updated_at: new Date().toISOString() }).eq('id', id)
      .then(r => { if (r.error) console.error('updateTodo failed:', r.error); });
  },
  deleteTodo(id) {
    if (!sb) return;
    sb.from('todos').delete().eq('id', id)
      .then(r => { if (r.error) console.error('deleteTodo failed:', r.error); });
  },

  savePriority(slot, text) {
    if (!sb) return;
    sb.from('priorities').upsert(
      { family_id: FAMILY_ID, session_id: currentSessionId, slot, text, updated_at: new Date().toISOString() },
      { onConflict: 'session_id,slot' }
    ).then(r => { if (r.error) console.error('savePriority failed:', r.error); });
  },

  async addNote(text, sortOrder) {
    if (!sb) throw new Error('offline');
    const { data } = await sb.from('notes').insert({
      family_id: FAMILY_ID, session_id: currentSessionId, text, sort_order: sortOrder,
    }).select().single();
    return data;
  },
  deleteNote(id) {
    if (!sb) return;
    sb.from('notes').delete().eq('id', id)
      .then(r => { if (r.error) console.error('deleteNote failed:', r.error); });
  },
  updateNote(id, text, dueDate) {
    if (!sb) return;
    sb.from('notes').update({ text, due_date: dueDate || null }).eq('id', id)
      .then(r => { if (r.error) console.error('updateNote failed:', r.error); });
  },

  saveUpcomingNote(slot, text) {
    if (!sb) return;
    sb.from('upcoming_notes').upsert(
      { family_id: FAMILY_ID, slot, text, updated_at: new Date().toISOString() },
      { onConflict: 'family_id,slot' }
    ).then(r => { if (r.error) console.error('saveUpcomingNote failed:', r.error); });
  },

  async saveBudgetData(data) {
    if (!sb) return;
    await sb.from('budget_data').upsert(
      { family_id: FAMILY_ID, data, updated_at: new Date().toISOString(), updated_by: 'chad' },
      { onConflict: 'family_id' }
    );
  },

  async newSession(rolledTodos) {
    if (!sb) return;
    await sb.from('sessions').update({ completed_at: new Date().toISOString() }).eq('id', currentSessionId);
    const { data } = await sb.from('sessions')
      .insert({ family_id: FAMILY_ID, session_date: new Date().toISOString().split('T')[0] })
      .select().single();
    currentSessionId = data.id;
    if (rolledTodos.length) {
      await sb.from('todos').insert(
        rolledTodos.map((item, i) => ({
          family_id: FAMILY_ID, session_id: currentSessionId,
          person: item.person, text: item.text, done: false, sort_order: i,
        }))
      );
    }
  },

  async loadTodos() {
    if (!sb) return INIT.todos;
    const { data } = await sb.from('todos').select('*').eq('session_id', currentSessionId).order('sort_order');
    const rows = data || [];
    return {
      chad:   rows.filter(t => t.person === 'chad').map(t => ({ id: t.id, text: t.text, done: t.done, due_date: t.due_date, created_at: t.created_at })),
      joelle: rows.filter(t => t.person === 'joelle').map(t => ({ id: t.id, text: t.text, done: t.done, due_date: t.due_date, created_at: t.created_at })),
    };
  },
  async loadPriorities() {
    if (!sb) return INIT.priorities;
    const { data } = await sb.from('priorities').select('*').eq('session_id', currentSessionId).order('slot');
    return [0,1,2].map(i => data?.find(p => p.slot === i+1)?.text ?? '');
  },
  async loadNotes() {
    if (!sb) return INIT.notes;
    const { data } = await sb.from('notes').select('*').eq('session_id', currentSessionId).order('sort_order');
    return (data || []).map(n => ({ id: n.id, text: n.text, due_date: n.due_date, created_at: n.created_at }));
  },
  async loadLastSession() {
    if (!sb) return null;
    const { data: sessions } = await sb.from('sessions')
      .select().eq('family_id', FAMILY_ID).not('completed_at', 'is', null)
      .order('completed_at', { ascending: false }).limit(1);
    const session = sessions?.[0];
    if (!session) return null;
    const { data: todos } = await sb.from('todos').select('*').eq('session_id', session.id).order('sort_order');
    return { session, todos: todos || [] };
  },
};

// ─── UTILS ────────────────────────────────────────────────────────────────────
const $  = (n) => new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', minimumFractionDigits:0, maximumFractionDigits:0 }).format(n);
const $$ = (n) => new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits:2 }).format(n);

const sortTodos = (arr) => {
  const ts = s => s.created_at ? new Date(s.created_at).getTime() : 0;
  const withDate = arr.filter(i => !i.done && i.due_date).sort((a, b) => new Date(a.due_date) - new Date(b.due_date));
  const noDate   = arr.filter(i => !i.done && !i.due_date).sort((a, b) => ts(a) - ts(b));
  const done     = arr.filter(i => i.done).sort((a, b) => ts(a) - ts(b));
  return [...withDate, ...noDate, ...done];
};
const sortNotes = (arr) => {
  const ts = s => s.created_at ? new Date(s.created_at).getTime() : 0;
  const withDate = arr.filter(n => n.due_date).sort((a, b) => new Date(a.due_date) - new Date(b.due_date));
  const noDate   = arr.filter(n => !n.due_date).sort((a, b) => ts(a) - ts(b));
  return [...withDate, ...noDate];
};
const formatDueDate = (dateStr) => {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
};
const monthsAhead = (n) => {
  const d = new Date(2026, 3, 1); d.setMonth(d.getMonth() + n);
  return d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
};

// ─── ANIMATED CHECKBOX ───────────────────────────────────────────────────────
const CheckBox = ({ checked, onChange, size = 26 }) => {
  const [burst, setBurst] = useState(false);
  const handleClick = () => {
    if (!checked) { setBurst(true); setTimeout(() => setBurst(false), 700); }
    onChange();
  };
  // 6 particles in Cadence palette colors
  const dots = [
    { tx:'0px',   ty:'-19px', c:'#2A8B68' },
    { tx:'14px',  ty:'-13px', c:'#C07A12' },
    { tx:'19px',  ty:'2px',   c:'#6B5EA8' },
    { tx:'13px',  ty:'15px',  c:'#2A8B68' },
    { tx:'-15px', ty:'11px',  c:'#C07A12' },
    { tx:'-19px', ty:'-4px',  c:'#6B5EA8' },
  ];
  return (
    <div onClick={handleClick} style={{ position:'relative', width:size, height:size, cursor:'pointer', flexShrink:0, userSelect:'none', WebkitUserSelect:'none' }}>
      <svg width={size} height={size} viewBox="0 0 28 28" style={{ display:'block', overflow:'visible' }}>
        <rect x="1.5" y="1.5" width="25" height="25" rx="8"
          fill={checked ? '#2A8B68' : 'transparent'}
          stroke={checked ? '#2A8B68' : '#C8C8CC'}
          strokeWidth="2.5"
          style={{
            transformBox:'fill-box', transformOrigin:'center',
            animation: burst ? 'cb-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards' : 'none',
            transition: burst ? 'none' : 'fill 0.15s, stroke 0.15s',
          }}
        />
        {checked && (
          <path key={burst ? 'b' : 's'}
            d="M7 14.5 L11.5 19 L21 9.5"
            fill="none" stroke="white" strokeWidth="2.5"
            strokeLinecap="round" strokeLinejoin="round"
            strokeDasharray="22"
            style={{
              strokeDashoffset: burst ? 22 : 0,
              animation: burst ? 'cb-draw 0.3s ease 0.1s forwards' : 'none',
            }}
          />
        )}
      </svg>
      {burst && dots.map((d, i) => (
        <div key={i} style={{
          position:'absolute', top:'50%', left:'50%',
          width:5, height:5, borderRadius:'50%', background:d.c,
          marginTop:-2.5, marginLeft:-2.5, pointerEvents:'none',
          '--tx': d.tx, '--ty': d.ty,
          animation:`cb-burst 0.6s ease ${i * 30}ms forwards`,
        }} />
      ))}
    </div>
  );
};

// ─── MOBILE DETECTION ────────────────────────────────────────────────────────
const useIsMobile = () => {
  const [mobile, setMobile] = useState(() => window.innerWidth < 768);
  useEffect(() => {
    const h = () => setMobile(window.innerWidth < 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return mobile;
};

// ─── OUR LISTS SCREEN (mobile-first, replaces familylists app) ───────────────
const OurListsScreen = ({ onGoHome }) => {
  const mobile = useIsMobile();
  const [tab, setTab] = useState('chad');
  const [items, setItems] = useState(INIT.todos);
  const [priorities, setPriorities] = useState(INIT.priorities);
  const [notesList, setNotesList] = useState(INIT.notes);
  const [input, setInput] = useState('');
  const [noteInput, setNoteInput] = useState('');
  const [addError, setAddError] = useState(null);
  const [expandedId, setExpandedId] = useState(null);
  const [editText, setEditText] = useState('');
  const [editDate, setEditDate] = useState('');
  const [expandedNoteId, setExpandedNoteId] = useState(null);
  const [editNoteText, setEditNoteText] = useState('');
  const [editNoteDate, setEditNoteDate] = useState('');

  const openExpand = (item) => {
    if (expandedId === item.id) { setExpandedId(null); return; }
    setExpandedId(item.id);
    setEditText(item.text);
    setEditDate(item.due_date || '');
  };
  const saveTodo = (p, id) => {
    const newText = editText.trim();
    if (!newText) return;
    setItems(prev => ({ ...prev, [p]: prev[p].map(i => i.id === id ? { ...i, text: newText, due_date: editDate || null } : i) }));
    db.updateTodo(id, newText, editDate || null);
    setExpandedId(null);
  };
  const openNoteExpand = (n) => {
    if (expandedNoteId === n.id) { setExpandedNoteId(null); return; }
    setExpandedNoteId(n.id);
    setEditNoteText(n.text);
    setEditNoteDate(n.due_date || '');
  };
  const saveNote = (id) => {
    const newText = editNoteText.trim();
    if (!newText) return;
    setNotesList(prev => prev.map(n => n.id === id ? { ...n, text: newText, due_date: editNoteDate || null } : n));
    db.updateNote(id, newText, editNoteDate || null);
    setExpandedNoteId(null);
  };

  const add = async () => {
    const t = input.trim();
    if (!t || (tab !== 'chad' && tab !== 'joelle')) return;
    try {
      const data = await db.addTodo(tab, t, items[tab].length);
      setItems(prev => ({ ...prev, [tab]: [...prev[tab], { id: data.id, text: t, done: false, due_date: null, created_at: data.created_at }] }));
      setInput('');
    } catch (err) {
      console.error('addTodo failed:', err);
      setAddError('Failed to save — check connection');
      setTimeout(() => setAddError(null), 4000);
    }
  };
  const toggle = (p, id) => {
    const done = !items[p].find(i => i.id === id).done;
    setItems(prev => ({ ...prev, [p]: prev[p].map(i => i.id === id ? { ...i, done } : i) }));
    db.toggleTodo(id, done);
  };
  const remove = (p, id) => {
    setItems(prev => ({ ...prev, [p]: prev[p].filter(i => i.id !== id) }));
    db.deleteTodo(id);
  };
  const updatePriority = (i, val) => {
    const n = [...priorities]; n[i] = val; setPriorities(n);
    db.savePriority(i + 1, val);
  };
  const addNote = async () => {
    const t = noteInput.trim(); if (!t) return;
    try {
      const data = await db.addNote(t, notesList.length);
      setNotesList(prev => [...prev, { id: data.id, text: t }]);
      setNoteInput('');
    } catch (err) {
      console.error('addNote failed:', err);
      setAddError('Failed to save — check connection');
      setTimeout(() => setAddError(null), 4000);
    }
  };
  const removeNote = (id) => {
    setNotesList(prev => prev.filter(n => n.id !== id));
    db.deleteNote(id);
  };

  const allTotal = items.chad.length + items.joelle.length;
  const allDone = items.chad.filter(i=>i.done).length + items.joelle.filter(i=>i.done).length;

  const TABS = [
    { id:'chad', label:'👦 Chad', count: items.chad.length, done: items.chad.filter(i=>i.done).length },
    { id:'joelle', label:'👩 Joelle', count: items.joelle.length, done: items.joelle.filter(i=>i.done).length },
    { id:'all', label:'All' },
    { id:'goals', label:'📌 Goals' },
  ];

  // ── Mobile layout ──────────────────────────────────────────────────────────
  if (mobile) {
    const showInput = tab === 'chad' || tab === 'joelle';
    const showNoteInput = tab === 'goals';
    const inputPerson = tab === 'chad' ? 'Chad' : 'Joelle';

    return (
      <div style={{ display:'flex', flexDirection:'column', height:'100dvh', background:T.cream, overflow:'hidden' }}>

          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <button onClick={onGoHome} style={{ background:'none', border:'none', padding:0, cursor:'pointer', textAlign:'left' }}>
              <p style={{ fontWeight:800, fontSize:20 }}>💚 Cadence</p>
              <p style={{ fontSize:12, color:T.dim }}>{allDone}/{allTotal} items done</p>
            </button>
            <div style={{ width:80 }}>
              <Bar val={allDone} max={allTotal||1} color={T.green} h={6} />
            </div>
          </div>
          {/* Tabs */}
          <div style={{ display:'flex', borderBottom:`1px solid ${T.border}`, marginLeft:-20, marginRight:-20, paddingLeft:12 }}>
            {TABS.map(t => (
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                background:'none', border:'none', padding:'10px 12px', fontSize:14, fontWeight:700,
                color: tab===t.id ? T.ink : T.dim, cursor:'pointer', flexShrink:0, whiteSpace:'nowrap',
                borderBottom:`3px solid ${tab===t.id ? T.green : 'transparent'}`, transition:'color .15s'
              }}>
                {t.label}
              </button>
            ))}
          </div>
        </div>

        {/* Scrollable content */}
        <div style={{ flex:1, overflowY:'auto', padding:'12px 16px', WebkitOverflowScrolling:'touch' }}>

          {/* Chad / Joelle tabs */}
          {(tab==='chad' || tab==='joelle') && (
            <div style={{ paddingBottom: showInput ? 90 : 24 }}>
              {items[tab].length === 0 && (
                <div style={{ textAlign:'center', padding:'60px 20px', color:T.dim }}>
                  <p style={{ fontSize:40, marginBottom:12 }}>✅</p>
                  <p style={{ fontSize:16, fontWeight:600 }}>All clear!</p>
                  <p style={{ fontSize:14, marginTop:4 }}>Add something below</p>
                </div>
              )}
              {sortTodos(items[tab]).map(item => {
                const isExp = expandedId === item.id;
                return (
                  <div key={item.id} style={{ marginBottom:10 }}>
                    <div style={{
                      display:'flex', alignItems:'center', gap:12,
                      background: item.done ? T.greenBg : '#fff',
                      border:`1px solid ${item.done ? T.greenMid : T.border}`,
                      borderRadius: isExp ? '16px 16px 0 0' : 16,
                      padding:'14px 16px', minHeight:56, transition:'background .15s'
                    }}>
                      <CheckBox checked={item.done} onChange={()=>toggle(tab, item.id)} size={28} />
                      <div onClick={()=>openExpand(item)} style={{ flex:1, cursor:'pointer' }}>
                        <p style={{ fontSize:16, color: item.done ? T.dim : T.ink, textDecoration: item.done ? 'line-through' : 'none', lineHeight:1.4 }}>{item.text}</p>
                        {item.due_date && !item.done && (
                          <p style={{ fontSize:12, color:T.amber, marginTop:2, fontWeight:600 }}>📅 {formatDueDate(item.due_date)}</p>
                        )}
                      </div>
                      <span style={{ fontSize:10, color:T.dim, marginRight:2 }}>{isExp ? '▲' : '▽'}</span>
                      <button onClick={()=>remove(tab, item.id)} style={{ background:'none', border:'none', cursor:'pointer', color:'#C8C8CC', fontSize:22, padding:'0 2px', lineHeight:1, minWidth:32, minHeight:32, display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
                    </div>
                    {isExp && (
                      <div style={{ background:'#F4F1EC', border:`1px solid ${T.border}`, borderTop:'none', borderRadius:'0 0 16px 16px', padding:'14px 16px' }}>
                        <input
                          value={editText}
                          onChange={e=>setEditText(e.target.value)}
                          style={{ width:'100%', border:`1px solid ${T.border}`, borderRadius:10, padding:'10px 14px', fontSize:15, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink, marginBottom:10 }}
                        />
                        <p style={{ fontSize:12, fontWeight:700, color:T.dim, marginBottom:6 }}>Due date (optional)</p>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                          <input type="date"
                            value={editDate}
                            onChange={e=>setEditDate(e.target.value)}

                          />
                          {editDate && <button onClick={()=>setEditDate('')} style={{ background:'none', border:'none', cursor:'pointer', color:T.dim, fontSize:13 }}>✕ Clear</button>}
                        </div>
                        <div style={{ display:'flex', gap:8 }}>
                          <button onClick={()=>saveTodo(tab, item.id)} style={{ background:T.green, color:'#fff', border:'none', borderRadius:10, padding:'10px 20px', fontSize:14, fontWeight:700, cursor:'pointer' }}>Save</button>
                          <button onClick={()=>setExpandedId(null)} style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:10, padding:'10px 16px', fontSize:14, cursor:'pointer', color:T.dim }}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* All tab */}
          {tab==='all' && (
            <div style={{ paddingBottom:24 }}>
              {['chad','joelle'].map(p => (
                <div key={p} style={{ marginBottom:24 }}>
                  <p style={{ fontSize:13, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:10, marginTop:8 }}>{p==='chad'?'👦 Chad':'👩 Joelle'}</p>
                  {items[p].length === 0 && <p style={{ color:T.dim, fontSize:14, padding:'8px 0' }}>Nothing here yet</p>}
                  {items[p].map(item => (
                    <div key={item.id} onClick={()=>toggle(p, item.id)} style={{
                      display:'flex', alignItems:'center', gap:12, marginBottom:8, cursor:'pointer',
                      background: item.done ? T.greenBg : '#fff', border:`1px solid ${item.done ? T.greenMid : T.border}`,
                      borderRadius:14, padding:'14px 16px', minHeight:52
                    }}>
                      <div style={{ width:24, height:24, borderRadius:7, border:`2px solid ${item.done ? T.green : '#C8C8CC'}`, background: item.done ? T.green : 'transparent', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        {item.done && <span style={{ color:'#fff', fontSize:12, fontWeight:800 }}>✓</span>}

                      <p style={{ flex:1, fontSize:15, color: item.done ? T.dim : T.ink, textDecoration: item.done ? 'line-through' : 'none' }}>{item.text}</p>
                    </div>

                </div>
              ))}
            </div>
          )}

          {/* Goals & Notes tab */}
          {tab==='goals' && (
            <div style={{ paddingBottom: 100 }}>
              <p style={{ fontSize:13, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:12, marginTop:8 }}>Our 3 Priorities</p>
              {priorities.map((p, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:12, background: T.greenBg, border:`1px solid ${T.greenMid}`, borderRadius:14, padding:'14px 16px', marginBottom:10 }}>
                  <span style={{ fontSize:16, fontWeight:800, color:T.green, flexShrink:0, width:24 }}>#{i+1}</span>
                  <input value={p} onChange={e=>updatePriority(i, e.target.value)} placeholder={`Priority #${i+1}...`}
                    style={{ flex:1, border:'none', outline:'none', background:'transparent', fontFamily:'inherit', fontSize:16, color:T.ink }} />
                </div>
              ))}
              <p style={{ fontSize:13, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:8, marginTop:20 }}>Notes</p>
              <p style={{ fontSize:13, color:T.dim, marginBottom:12, lineHeight:1.5 }}>Thoughts, tangents, things to remember — not necessarily actionable.</p>
              {sortNotes(notesList).map((n, i) => {
                const isNoteExp = expandedNoteId === n.id;
                return (
                  <div key={n.id}>
                    <div style={{ display:'flex', alignItems:'flex-start', gap:10, padding:'12px 0', borderBottom: isNoteExp ? 'none' : `1px solid ${T.border}` }}>

                      <div onClick={()=>openNoteExpand(n)} style={{ flex:1, cursor:'pointer' }}>

                      <button onClick={()=>removeNote(n.id)} style={{ background:'none', border:'none', cursor:'pointer', color:'#C8C8CC', fontSize:20, padding:'0 4px', minWidth:32, minHeight:32 }}>×</button>

                      <div style={{ background:'#F4F1EC', border:`1px solid ${T.border}`, borderRadius:10, padding:'12px 14px', marginBottom:10 }}>
                        <textarea
                          value={editNoteText}
                          onChange={e=>setEditNoteText(e.target.value)}
                          rows={3}
                          style={{ width:'100%', border:`1px solid ${T.border}`, borderRadius:8, padding:'10px 12px', fontSize:14, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink, resize:'none', lineHeight:1.5, marginBottom:10 }}
                        />
                        <p style={{ fontSize:12, fontWeight:700, color:T.dim, marginBottom:6 }}>Due date (optional)</p>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                          <input type="date"
                            value={editNoteDate}
                            onChange={e=>setEditNoteDate(e.target.value)}

                          />
                          {editNoteDate && <button onClick={()=>setEditNoteDate('')} style={{ background:'none', border:'none', cursor:'pointer', color:T.dim, fontSize:13 }}>✕ Clear</button>}
                        </div>
                        <div style={{ display:'flex', gap:8 }}>
                          <button onClick={()=>saveNote(n.id)} style={{ background:T.amber, color:'#fff', border:'none', borderRadius:10, padding:'9px 18px', fontSize:14, fontWeight:700, cursor:'pointer' }}>Save</button>
                          <button onClick={()=>setExpandedNoteId(null)} style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:10, padding:'9px 14px', fontSize:14, cursor:'pointer', color:T.dim }}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

        {/* Fixed bottom input bar */}
        {(showInput || showNoteInput) && (
          <div style={{ background:'#fff', borderTop:`1px solid ${T.border}`, padding:`12px 16px`, paddingBottom:`max(12px, env(safe-area-inset-bottom))`, flexShrink:0 }}>
            {addError && <p style={{ fontSize:12, color:T.coral, marginBottom:8 }}>{addError}</p>}
            <div style={{ display:'flex', gap:10 }}>
              <input
                value={showInput ? input : noteInput}
                onChange={e => showInput ? setInput(e.target.value) : setNoteInput(e.target.value)}

                placeholder={showInput ? `Add to ${inputPerson}'s list...` : 'Add a note...'}

              />
              <button onClick={showInput ? add : addNote} style={{ background: showInput ? T.green : T.amber, color:'#fff', border:'none', borderRadius:14, padding:'14px 20px', fontSize:20, fontWeight:800, cursor:'pointer', minWidth:52 }}>+</button>

                    {item.done && <span style={{ color:'#fff', fontSize:11, fontWeight:800 }}>✓</span>}
                  </div>
                  <p style={{ flex:1, fontSize:14, color: item.done ? T.dim : T.ink, textDecoration: item.done ? 'line-through' : 'none' }}>{item.text}</p>

              {priorities.map((p, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:12, background:T.greenBg, border:`1px solid ${T.greenMid}`, borderRadius:14, padding:'14px 18px' }}>
                  <span style={{ fontSize:15, fontWeight:800, color:T.green, flexShrink:0 }}>#{i+1}</span>
                  <input value={p} onChange={e=>updatePriority(i, e.target.value)} placeholder={`Priority #${i+1}...`}
                    style={{ flex:1, border:'none', outline:'none', background:'transparent', fontFamily:'inherit', fontSize:15, color:T.ink }} />
                </div>
              ))}
            </div>
          </div>
          <div>
            <p style={{ fontSize:12, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:8 }}>Session Notes</p>
            <p style={{ fontSize:13, color:T.dim, marginBottom:12 }}>Thoughts, tangents, things to remember — doesn't have to be budget-related.</p>
            <div style={{ display:'flex', flexDirection:'column' }}>
              {sortNotes(notesList).map((n, i) => {
                const isNoteExp = expandedNoteId === n.id;
                return (
                  <div key={n.id}>
                    <div style={{ display:'flex', alignItems:'flex-start', gap:10, padding:'10px 0', borderBottom: isNoteExp ? 'none' : `1px solid ${T.border}` }}>
                      <span style={{ fontSize:13, color:T.dim, marginTop:2, width:20 }}>{i+1}.</span>
                      <div onClick={()=>openNoteExpand(n)} style={{ flex:1, cursor:'pointer' }}>
                        <p style={{ fontSize:14, color:T.ink, lineHeight:1.5 }}>{n.text}</p>
                        {n.due_date && <p style={{ fontSize:12, color:T.amber, marginTop:2, fontWeight:600 }}>📅 {formatDueDate(n.due_date)}</p>}
                      </div>
                      <button onClick={()=>removeNote(n.id)} style={{ background:'none', border:'none', cursor:'pointer', color:T.border, fontSize:18, padding:'0 4px' }}>×</button>
                    </div>
                    {isNoteExp && (
                      <div style={{ background:'#F4F1EC', border:`1px solid ${T.border}`, borderTop:'none', borderRadius:'0 0 10px 10px', padding:'12px 14px', marginBottom:4 }}>
                        <textarea
                          value={editNoteText}
                          onChange={e=>setEditNoteText(e.target.value)}
                          rows={2}
                          style={{ width:'100%', border:`1px solid ${T.border}`, borderRadius:8, padding:'8px 12px', fontSize:14, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink, resize:'none', lineHeight:1.5, marginBottom:10 }}
                        />
                        <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:10 }}>
                          <div>
                            <p style={{ fontSize:12, fontWeight:700, color:T.dim, marginBottom:4 }}>Due date (optional)</p>
                            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                              <input type="date"
                                value={editNoteDate}
                                onChange={e=>setEditNoteDate(e.target.value)}
                                style={{ border:`1px solid ${T.border}`, borderRadius:8, padding:'7px 10px', fontSize:13, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink }}
                              />
                              {editNoteDate && <button onClick={()=>setEditNoteDate('')} style={{ background:'none', border:'none', cursor:'pointer', color:T.dim, fontSize:12 }}>✕ Clear</button>}
                            </div>
                          </div>
                        </div>
                        <div style={{ display:'flex', gap:8 }}>
                          <button onClick={()=>saveNote(n.id)} style={{ background:T.amber, color:'#fff', border:'none', borderRadius:8, padding:'8px 16px', fontSize:13, fontWeight:700, cursor:'pointer' }}>Save</button>
                          <button onClick={()=>setExpandedNoteId(null)} style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:8, padding:'8px 12px', fontSize:13, cursor:'pointer', color:T.dim }}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{ display:'flex', gap:10, marginTop:14 }}>
              <input value={noteInput} onChange={e=>setNoteInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote()}
                placeholder="Add a note..."
                style={{ flex:1, border:`1px solid ${T.border}`, borderRadius:14, padding:'12px 18px', fontSize:14, outline:'none', fontFamily:'inherit', background:T.card }} />
              <button onClick={addNote} style={{ background:T.amber, color:'#fff', border:'none', borderRadius:14, padding:'12px 20px', fontSize:16, fontWeight:800, cursor:'pointer' }}>+</button>
            </div>
            {addError && <p style={{ fontSize:12, color:T.coral, marginTop:6 }}>{addError}</p>}
          </div>
        </div>
      )}
    </div>
  );
};

// ─── PREP MODE ────────────────────────────────────────────────────────────────
const EditableRow = ({ idx, total, onUp, onDown, onDelete, T, fieldStyle,
  nameValue, onNameChange, namePlaceholder,
  noteValue, onNoteChange, notePlaceholder,
  amountValue, onAmountChange,
  dayValue, onDayChange }) => {
  const isFirst = idx === 0;
  const isLast = idx === total - 1;
  const narrow = useIsNarrow();
  const arrowBtn = (disabled) => ({
    background:'none', border:'none', cursor: disabled ? 'default' : 'pointer',
    color: disabled ? T.border : T.dim, fontSize:16, padding:'0 2px', lineHeight:1,
  });
  return (
    <div style={{ display:'flex', flexWrap:'wrap', alignItems:'stretch', gap:10, padding:'12px 14px', background:T.card, border:`1px solid ${T.border}`, borderRadius:14 }}>
      <div style={{ display:'flex', flexDirection:'column', justifyContent:'center', gap:6, flexShrink:0 }}>
        <button onClick={onUp} disabled={isFirst} style={arrowBtn(isFirst)} aria-label="Move up">▲</button>
        <button onClick={onDown} disabled={isLast} style={arrowBtn(isLast)} aria-label="Move down">▼</button>
      </div>
      <div style={{ flex:'1 1 55%', display:'flex', flexDirection:'column', gap:6, minWidth:0 }}>
        <input value={nameValue || ''} onChange={e=>onNameChange(e.target.value)} placeholder={namePlaceholder}
          style={{ ...fieldStyle, fontWeight:600, padding:'7px 10px' }} />
        <input value={noteValue || ''} onChange={e=>onNoteChange(e.target.value)} placeholder={notePlaceholder}
          style={{ ...fieldStyle, fontSize:12, color:T.dim, padding:'6px 10px' }} />
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0, ...(narrow ? { width:'100%', justifyContent:'flex-end' } : {}) }}>
        {onDayChange && (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, flexShrink:0, justifyContent:'center' }}>
            <input type="number" inputMode="numeric" min="1" max="31" value={dayValue ?? ''} onChange={e=>onDayChange(e.target.value)} placeholder="—"
              style={{ ...fieldStyle, width:52, textAlign:'center', padding:'7px 4px' }} aria-label="Day of month" />
            <span style={{ color:T.dim, fontSize:10 }}>day</span>
          </div>
        )}
        <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
          <span style={{ color:T.dim, fontSize:14 }}>$</span>
          <input type="number" inputMode="decimal" step="0.01" value={amountValue} onChange={e=>onAmountChange(e.target.value)}
            style={{ ...fieldStyle, width:92, textAlign:'right' }} />
          <span style={{ color:T.dim, fontSize:12 }}>/mo</span>
        </div>
        <button onClick={onDelete} style={{ background:T.coralBg, color:T.coral, border:`1px solid ${T.coralMid}`, borderRadius:10, padding:'0 14px', fontSize:18, cursor:'pointer', fontWeight:700, flexShrink:0, alignSelf:'stretch' }} aria-label="Remove">×</button>
      </div>
    </div>
  );
};

const PrepMode = ({ onExit }) => {
  const [tab, setTab] = useState('balances');
  const [sessionDate, setSessionDate] = useState(() => {
    const d = new Date(D.date + ' 12:00:00');
    return isNaN(d.getTime()) ? new Date().toISOString().slice(0,10) : d.toISOString().slice(0,10);
  });
  const narrow = useIsNarrow();
  const [acct, setAcct] = useState({ ...D.accounts });
  const [sources, setSources] = useState(D.income.sources.map((s,i) => ({ ...s, _id: i })));
  const [bills, setBills] = useState((D.fixedBillsList || []).map((b,i) => ({ ...b, _id: b.id || `b_${i}_${Date.now()}` })));
  const [spending, setSpending] = useState(D.spending.map((s,i) => ({ ...s, _id: `s_${i}` })));
  const [groceryWeekly, setGroceryWeekly] = useState(D.grocery?.weekly ?? 0);
  const [upcomingNotes, setUpcomingNotes] = useState(INIT.upcomingNotes);
  const [todos, setTodos] = useState(INIT.todos);
  useEffect(() => { db.loadTodos().then(t => setTodos(t)); }, []);
  const [rollForward, setRollForward] = useState(true);
  const [clearNotes, setClearNotes] = useState(false);
  const [saved, setSaved] = useState(false);
  const [saving, setSaving] = useState(false);

  const incomeTotal = Math.round(sources.reduce((s, src) => s + (parseFloat(src.amt) || 0), 0));
  const fixedBills = Math.round(bills.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0) * 100) / 100;
  const variableSpend = spending.reduce((s, sp) => s + (parseFloat(sp.mo) || 0), 0);
  const deficit = incomeTotal - Math.round(fixedBills) - Math.round(variableSpend);

  const updateAcct = (k, v) => setAcct(a => ({ ...a, [k]: parseFloat(v) || 0 }));
  const updateSource = (id, k, v) => setSources(s => s.map(x => x._id===id
    ? { ...x, [k]: k==='amt' ? (parseFloat(v)||0) : k==='day' ? (v==='' ? null : Math.max(1, Math.min(31, parseInt(v)||1))) : v }
    : x));
  const addSource = () => setSources(s => [...s, { label:'New income source', amt:0, acct:'Billing', when:'Monthly', day:15, _id: Date.now() }]);
  const removeSource = (id) => setSources(s => s.filter(x => x._id !== id));

  const moveInList = (setter) => (id, dir) => setter(arr => {
    const i = arr.findIndex(x => x._id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return arr;
    const next = [...arr]; [next[i], next[j]] = [next[j], next[i]]; return next;
  });
  const updateBill = (id, k, v) => setBills(s => s.map(x => x._id===id
    ? { ...x, [k]: k==='amount' ? (parseFloat(v)||0) : k==='day' ? (v==='' ? null : Math.max(1, Math.min(31, parseInt(v)||1))) : v }
    : x));
  const moveBill = moveInList(setBills);
  const removeBill = (id) => setBills(s => s.filter(x => x._id !== id));
  const addBill = () => setBills(s => [...s, { _id: `b_${Date.now()}`, name: 'New bill', amount: 0, day: 1, note: '' }]);

  const updateSpend = (id, k, v) => setSpending(s => s.map(x => x._id===id ? { ...x, [k]: k==='mo' ? (parseFloat(v)||0) : v } : x));
  const moveSpend = moveInList(setSpending);
  const removeSpend = (id) => setSpending(s => s.filter(x => x._id !== id));
  const addSpend = () => setSpending(s => [...s, { _id: `s_${Date.now()}`, cat: 'New category', mo: 0, note: '', color: '#7D8A6F', lever: false }]);

  const toggleTodoDone = (p, id) => setTodos(t => ({ ...t, [p]: t[p].map(i => i.id===id ? { ...i, done:!i.done } : i) }));

  const handleSave = async () => {
    if (saving) return;
    setSaving(true);
    try {
      const totalLiquid = Object.entries(acct)
        .filter(([k]) => ['billing','groceries','propertyTax','emergency','baselane','opFunSavings','personalClearing'].includes(k))
        .reduce((s,[,v]) => s + v, 0);
      const totalDebt = (acct.sapphire||0) + (acct.ink||0) + (acct.apple||0);
      const newAcct = { ...acct, totalLiquid: Math.round(totalLiquid*100)/100, totalDebt: Math.round(totalDebt*100)/100, netCash: Math.round((totalLiquid - totalDebt)*100)/100 };

      const dateForDisplay = sessionDate
        ? new Date(sessionDate + 'T12:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
        : D.date;

      const newData = {
        date: dateForDisplay,
        accounts: newAcct,
        income: { total: incomeTotal, sources: sources.map(({ _id, ...rest }) => rest) },
        fixedBills: Math.round(fixedBills),
        fixedBillsList: bills.map(({ _id, ...rest }) => ({ ...rest, id: rest.id || _id })),
        variableSpend: Math.round(variableSpend),
        deficit,
        spending: spending.map(({ _id, ...rest }) => rest),
        grocery: { ...(D.grocery || {}), weekly: parseFloat(groceryWeekly) || 0 },
        cycle: D.cycle,
        goals: D.goals,   // preserve goal progress (edited on the Goals screen, not here)
      };

      const notesToSave = clearNotes ? ['','','','',''] : upcomingNotes;
      const rolledTodos = rollForward
        ? [
            ...todos.chad.filter(i => !i.done).map(i => ({ person: 'chad', text: i.text })),
            ...todos.joelle.filter(i => !i.done).map(i => ({ person: 'joelle', text: i.text })),
          ]
        : [];

      await Promise.all([
        db.saveBudgetData(newData),
        ...notesToSave.map((text, i) => db.saveUpcomingNote(i + 1, text)),
      ]);
      await db.newSession(rolledTodos);

      setSaved(true);
      setTimeout(() => window.location.reload(), 900);
    } catch (err) {
      console.error('Prep Mode save failed:', err);
      setSaving(false);
    }
  };

  const chadDone = todos.chad.filter(i=>i.done).length;
  const joelleDone = todos.joelle.filter(i=>i.done).length;
  const chadRoll = todos.chad.filter(i=>!i.done).length;
  const joelleRoll = todos.joelle.filter(i=>!i.done).length;

  const PREP_TABS = [
    { id:'balances', label:'💰 Balances' },
    { id:'income',   label:'📥 Income' },
    { id:'fixed',    label:'🧾 Fixed' },
    { id:'variable', label:'🛒 Variable' },
    { id:'session',  label:'✅ Last Session' },
    { id:'upcoming', label:'📌 Upcoming Notes' },
  ];

  const fieldStyle = { border:`1px solid ${T.border}`, borderRadius:10, padding:'9px 14px', fontSize:14, fontFamily:'inherit', outline:'none', background:T.card, color:T.ink, width:'100%' };
  const labelStyle = { fontSize:12, color:T.dim, fontWeight:700, marginBottom:4, display:'block' };
  const rowStyle = { display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 0', borderBottom:`1px solid ${T.border}`, gap:12 };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:T.cream, overflow:'hidden' }}>
      {/* Header */}
      <div style={{ background:'#fff', borderBottom:`1px solid ${T.border}`, padding: narrow ? '12px 16px' : '14px 40px', display:'flex', alignItems:'center', gap: narrow ? 10 : 16, flexShrink:0 }}>
        <button onClick={onExit} style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:100, padding:'7px 18px', fontSize:13, cursor:'pointer', color:T.dim, fontWeight:600 }}>← Back</button>
        <div>
          <p style={{ fontWeight:800, fontSize: narrow ? 16 : 18 }}>🔧 Prep Mode</p>
          {!narrow && <p style={{ fontSize:12, color:T.dim }}>Update data before your next money date session</p>}
        </div>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:12 }}>
          {saved && <span style={{ fontSize:13, color:T.green, fontWeight:700 }}>✓ Saved! Reloading…</span>}
          <button onClick={handleSave} disabled={saving || saved} style={{ background: saved ? T.green : T.ink, color:'#fff', border:'none', borderRadius:100, padding:'10px 28px', fontSize:14, fontWeight:700, cursor: saving||saved ? 'default' : 'pointer', opacity: saving ? 0.7 : 1, transition:'all .2s' }}>
            {saved ? '✓ Done' : saving ? 'Saving…' : 'Save & Apply →'}
          </button>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{ background:'#fff', borderBottom:`1px solid ${T.border}`, padding: narrow ? '0 8px' : '0 40px', display:'flex', gap:4, flexShrink:0, overflowX:'auto', WebkitOverflowScrolling:'touch' }}>
        {PREP_TABS.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            background:'none', border:'none', padding: narrow ? '12px 12px' : '12px 16px', fontSize:13, fontWeight:700,
            color: tab===t.id ? T.ink : T.dim, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
            borderBottom: `3px solid ${tab===t.id ? T.ink : 'transparent'}`, transition:'all .15s'
          }}>{t.label}</button>
        ))}
      </div>

      {/* Content */}
      <div style={{ flex:1, overflowY:'auto', padding: narrow ? '20px 16px' : '32px 40px', maxWidth:860, width:'100%', margin:'0 auto' }}>

        {/* BALANCES */}
        {tab==='balances' && (
          <div>
            <p style={{ fontSize:22, fontWeight:800, marginBottom:6 }}>Account Balances</p>
            <p style={{ color:T.dim, fontSize:14, marginBottom:24 }}>Update each account to today's actual balance. The Big Picture screen will reflect these immediately.</p>

            <p style={{ fontSize:12, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:12 }}>Session Date</p>
            <Card style={{ marginBottom:20 }}>
              <div style={rowStyle}>

// ─── PULL TO REFRESH ─────────────────────────────────────────────────────────
const PullToRefresh = ({ children, screenId }) => {
  const [pullDist, setPullDist] = React.useState(0);
  const startY = React.useRef(null);
  const distRef = React.useRef(0);
  const divRef = React.useRef(null);
  const THRESHOLD = 72;

  React.useEffect(() => {
    const el = divRef.current;
    if (!el) return;
    const onStart = (e) => {
      if (el.scrollTop === 0) startY.current = e.touches[0].clientY;
    };
    const onMove = (e) => {
      if (startY.current === null) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0) {
        const d = Math.min(dy, THRESHOLD + 28);
        distRef.current = d;
        setPullDist(d);
        if (dy > 6) e.preventDefault();
      } else {
        startY.current = null;
        distRef.current = 0;
        setPullDist(0);
      }
    };
    const onEnd = () => {
      if (distRef.current >= THRESHOLD) window.location.reload();
      startY.current = null;
      distRef.current = 0;
      setPullDist(0);
    };
    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
    };
  }, []);

  const ready = pullDist >= THRESHOLD;
  return (
    <div ref={divRef} data-scroll style={{ flex:1, overflowY:'auto', position:'relative' }}>
      {pullDist > 0 && (
        <div style={{
          position:'absolute', top:0, left:0, right:0, height:pullDist,
          display:'flex', alignItems:'center', justifyContent:'center',
          background: T.cream, zIndex:50,
          borderBottom:`1px solid ${ready ? T.green : T.border}`
        }}>
          <span style={{
            fontSize:13, fontWeight:600, color: ready ? T.green : T.dim,
            display:'inline-block', transform:`rotate(${ready ? 180 : 0}deg)`, transition:'transform .2s, color .2s'
          }}>↓</span>
        </div>
      )}
      {children}
    </div>
  );
};

// ─── APP SHELL ────────────────────────────────────────────────────────────────
// ─── MONEY-MOVEMENTS MODEL ───────────────────────────────────────────────────
// Everything that moves cash is a "movement": income (+ to Billing), bill (− from
// Billing, external), or transfer (− from Billing → one of our own accounts).
// getMovements() unifies the (still legacy-stored) income/bills/transfers lists.
const getMovements = (D) => {
  const out = [];
  (D.income?.sources || []).forEach((s, i) => {
    if (s.allocate) return;                                              // lands elsewhere — not into Billing
    if (!String(s.acct || '').toLowerCase().includes('billing')) return;
    if (!(Number(s.amt) > 0)) return;
    out.push({ id: 'inc' + i, kind: 'income', label: s.label, sub: s.when, amount: Number(s.amt), cadence: 'monthly', day: s.day, note: s.note });
  });
  (D.fixedBillsList || []).forEach(b => {
    if (b.paused || b.day == null || !(Number(b.amount) > 0)) return;
    out.push({ id: b.id, kind: 'bill', label: b.name, amount: -Number(b.amount), cadence: 'monthly', day: Number(b.day), note: b.note });
  });
  (D.transfers || []).forEach(t => {
    if (t.paused || !(Number(t.amount) > 0)) return;
    out.push({ id: t.id, kind: 'transfer', label: t.label, amount: -Number(t.amount), cadence: t.cadence || 'monthly', day: t.day, weekday: t.weekday, days: t.days, to: t.to, fund: t.fund, spendType: t.spendType, note: t.note });
  });
  return out;
};

// The calendar month the cycle covers → { year, month(0-indexed) }. Lets weekly
// schedules land on real weekdays (so "every Friday" is 4 or 5 times automatically).
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const cycleBase = (D) => {
  const lbl = D.cycle?.label || '';
  const parts = lbl.trim().split(/\s+/);
  const guess = parts.length >= 2 ? new Date(`${parts[0]} 1, ${parts[1]}`) : new Date();
  const d = isNaN(guess.getTime()) ? new Date() : guess;
  return { year: d.getFullYear(), month: d.getMonth() };
};

// Expand one movement into the dated events it produces within [asOf, endDay].
// cadence: 'monthly' (one `day`), 'weekly' (every `weekday` 0–6, or legacy `day`
// anchor), 'semimonthly' (two `days`, e.g. [15,30]), 'once' (single `day`).
const expandMovement = (m, asOf, endDay, base) => {
  if (m.cadence === 'weekly' && m.weekday != null) {
    const evs = [];
    for (let d = 1; d <= endDay; d++)
      if (new Date(base.year, base.month, d).getDay() === Number(m.weekday) && d >= asOf) evs.push({ ...m, day: d });
    return evs;
  }
  if (m.cadence === 'weekly') {                       // legacy: anchor day + 7
    const anchor = Number(m.day) || 2; const evs = [];
    for (let d = anchor; d <= endDay; d += 7) if (d >= asOf) evs.push({ ...m, day: d });
    return evs;
  }
  if (m.cadence === 'semimonthly') {
    return (m.days || []).map(Number).filter(d => d != null && d >= asOf && d <= endDay).map(d => ({ ...m, day: d }));
  }
  const d = Number(m.day);                             // monthly / once
  return (m.day != null && d >= asOf && d <= endDay) ? [{ ...m, day: d }] : [];
};

// Rough monthly equivalent of a movement's amount (for totals / fund tracking).
const monthlyEquivalent = (m) => {
  const a = Number(m.amount) || 0;
  if (m.cadence === 'weekly') return a * 4.33;
  if (m.cadence === 'semimonthly') return a * (m.days?.length || 2);
  return a;
};

// Walk the Billing balance forward from today through end of the cycle.
const buildProjection = (D, asOfDay) => {
  const endDay = D.cycle?.endDay || 30;
  const start = Number(D.accounts?.billing) || 0;
  const base = cycleBase(D);

  const events = [];
  getMovements(D).forEach(m => expandMovement(m, asOfDay, endDay, base).forEach(e => events.push(e)));
  // Within a day, outflows before income (worst case) so the low point is honest.
  events.sort((a, b) => a.day - b.day || a.amount - b.amount);

  let bal = start;
  let low = { balance: start, day: asOfDay, label: 'Starting balance' };
  const walk = events.map(e => {
    bal = Math.round((bal + e.amount) * 100) / 100;
    const row = { ...e, balance: bal };
    if (bal < low.balance) low = { balance: bal, day: e.day, label: e.label };
    return row;
  });

  const sumKind = k => walk.filter(e => e.kind === k).reduce((s, e) => s + e.amount, 0);
  const incomeTotal   = sumKind('income');
  const billTotal     = sumKind('bill');
  const transferTotal = sumKind('transfer');
  const allocatable   = (D.income?.sources || []).filter(s => s.allocate).reduce((s, x) => s + (Number(x.amt) || 0), 0);

  return { start, end: bal, walk, low, incomeTotal, billTotal, transferTotal, groceryTotal: transferTotal, allocatable, asOfDay, endDay };
};

// Split the projection walk into pay-period buckets (before/after a split day,
// default the 15th) — the way the Stewarts actually decide about floats.
// Each bucket: the paycheck(s) funding it, its bills + transfers, and whether
// Billing stays positive through it ("autopilot") or needs a float.
const buildPeriods = (flow, split = 15) => {
  const bucket = (lo, hi) => flow.walk.filter(e => e.day >= lo && e.day <= hi);
  const ranges = [];
  if (flow.asOfDay < split) ranges.push({ key:'before', label:'Before the 15th', lo: flow.asOfDay, hi: split - 1 });
  ranges.push({ key:'after', label: flow.asOfDay >= split ? 'Rest of the month' : 'The 15th onward', lo: Math.max(flow.asOfDay, split), hi: flow.endDay });

  let entering = flow.start;
  return ranges.map(r => {
    const events = bucket(r.lo, r.hi);
    const sum = k => events.filter(e => e.kind === k).reduce((s, e) => s + e.amount, 0);
    const income = sum('income'), bills = sum('bill'), transfers = sum('transfer');
    const bals = events.map(e => e.balance);
    const minBal = bals.length ? Math.min(entering, ...bals) : entering;
    const exit = bals.length ? bals[bals.length - 1] : entering;
    const out = { ...r, entering, events, income, bills, transfers, minBal, exit, covered: minBal >= -0.005, shortfall: Math.max(0, Math.round(-minBal * 100) / 100), lowDay: (() => { let d = null, m = entering; for (const e of events) if (e.balance < m) { m = e.balance; d = e.day; } return d; })() };
    entering = exit;
    return out;
  });
};

// Months from today until an ISO due date (rounded, min 0).
const monthsUntil = (dueISO) => {
  if (!dueISO) return null;
  const now = new Date();
  const due = new Date(dueISO + (dueISO.length <= 10 ? 'T12:00:00' : ''));
  if (isNaN(due.getTime())) return null;
  return Math.max(0, Math.round((due - now) / (1000 * 60 * 60 * 24 * 30.44)));
};

// Is a sinking fund on track to hit its target by its due date?
// Projected = current account balance + (monthly transfer × months left).
const fundStatus = (D, t) => {
  if (!t.fund || !(Number(t.fund.target) > 0)) return null;
  const bal = Number(D.accounts?.[t.to]) || 0;
  const monthly = monthlyEquivalent(t);
  const months = monthsUntil(t.fund.dueDate);
  const projected = months == null ? bal : Math.round((bal + monthly * months) * 100) / 100;
  const target = Number(t.fund.target);
  const onTrack = projected >= target;
  const pct = target > 0 ? Math.min(100, Math.round((bal / target) * 100)) : 0;
  return { bal, monthly, months, projected, target, onTrack, pct, dated: !!t.fund.dueDate, shortfall: Math.max(0, Math.round((target - projected) * 100) / 100) };
};

// Live-save: merge a patch into the in-memory D and upsert the whole budget blob.
// Used by the editable screens so changes persist immediately (no separate "apply").
const LIQUID_KEYS = ['billing','groceries','propertyTax','emergency','baselane','opFunSavings','personalClearing'];
const recomputeTotals = (accounts) => {
  const liquid = LIQUID_KEYS.reduce((s,k)=> s + (Number(accounts[k])||0), 0);
  const debt = (Number(accounts.sapphire)||0) + (Number(accounts.ink)||0) + (Number(accounts.apple)||0);
  return { ...accounts, totalLiquid: Math.round(liquid*100)/100, totalDebt: Math.round(debt*100)/100, netCash: Math.round((liquid-debt)*100)/100 };
};
const saveBudget = (patch) => {
  Object.assign(D, patch);
  if (D.fixedBillsList) D.fixedBills = Math.round(D.fixedBillsList.reduce((s,b)=> s + (Number(b.amount)||0), 0));
  return db.saveBudgetData({
    date:D.date, cycle:D.cycle, accounts:D.accounts, income:D.income, grocery:D.grocery,
    transfers:D.transfers, fixedBills:D.fixedBills, fixedBillsList:D.fixedBillsList,
    variableSpend:D.variableSpend, deficit:D.deficit, spending:D.spending, goals:D.goals,
  }).catch(e => console.error('saveBudget failed:', e));
};
// Debounce a function by `ms` (module-level, per-key timers).
const _debTimers = {};
const debouncedSave = (key, patch, ms = 600) => {
  clearTimeout(_debTimers[key]);
  _debTimers[key] = setTimeout(() => saveBudget(patch), ms);
};

// Accounts a float transfer could come from, largest balance first.
const floatSources = (D) => ([
  ['emergency', 'Emergency Fund'], ['baselane', 'Baselane'],
  ['opFunSavings', 'Fun Savings'], ['propertyTax', 'Property Tax savings'],
]).map(([k, label]) => ({ key: k, label, bal: Number(D.accounts?.[k]) || 0 }))
  .filter(a => a.bal > 0).sort((a, b) => b.bal - a.bal);

// Simple responsive SVG chart of the running balance across the month.
const BalanceChart = ({ flow }) => {
  const pts = [{ day: flow.asOfDay, balance: flow.start }, ...flow.walk.map(w => ({ day: w.day, balance: w.balance }))];
  const W = 100, H = 42;
  const xlo = flow.asOfDay, xhi = flow.endDay;
  const bals = pts.map(p => p.balance);
  let ymin = Math.min(0, ...bals), ymax = Math.max(0, ...bals);
  if (ymin === ymax) { ymin -= 1; ymax += 1; }
  const pad = (ymax - ymin) * 0.12;
  ymin -= pad; ymax += pad;
  const X = d => xhi === xlo ? 0 : ((d - xlo) / (xhi - xlo)) * W;
  const Y = v => H - ((v - ymin) / (ymax - ymin)) * H;
  const zeroY = Y(0);
  const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${X(p.day).toFixed(2)},${Y(p.balance).toFixed(2)}`).join(' ');
  const dips = flow.low.balance < 0;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ width:'100%', height:150, display:'block' }}>
      {/* danger zone below zero */}
      {zeroY < H && <rect x="0" y={zeroY} width={W} height={H - zeroY} fill={T.coralBg} />}
      {/* zero line */}
      <line x1="0" y1={zeroY} x2={W} y2={zeroY} stroke={dips ? T.coralMid : T.border} strokeWidth="0.4" strokeDasharray="1.5 1.5" vectorEffect="non-scaling-stroke" />
      {/* balance line */}
      <path d={line} fill="none" stroke={dips ? T.coral : T.green} strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
      {/* event dots */}
      {flow.walk.map((w, i) => (
        <circle key={i} cx={X(w.day)} cy={Y(w.balance)} r="1.1" fill={w.balance < 0 ? T.coral : T.ink} vectorEffect="non-scaling-stroke" />
      ))}
      {/* low point marker */}
      <circle cx={X(flow.low.day)} cy={Y(flow.low.balance)} r="2.2" fill={dips ? T.coral : T.green} stroke="#fff" strokeWidth="0.8" vectorEffect="non-scaling-stroke" />
    </svg>
  );
};
