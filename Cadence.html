const GOAL_ICONS = ['🛡️','🍳','🏠','🚗','✈️','👶','💍','🎓','🏖️','💰','🎯','❤️'];

const GoalsProgress = ({ onGo }) => {
  const [goals, setGoals] = useState(() => (D.goals || []).map((g, i) => ({
    _id: g.id || `g_${i}`, icon: g.icon || '🎯', name: g.name || 'Goal',
    target: Number(g.target) || 0, saved: Number(g.saved) || 0, note: g.note || '',
    contributions: Array.isArray(g.contributions) ? g.contributions : [],
  })));
  const [amt, setAmt] = useState({});
  const [toast, setToast] = useState(null);
  const [editId, setEditId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [newGoal, setNewGoal] = useState({ name:'', target:'', icon:'🎯' });
  const [accts, setAccts] = useState(() => ({ ...D.accounts }));
  const [payAmt, setPayAmt] = useState({});

  const DEBTS = [['sapphire','Chase Sapphire','💳'],['ink','Chase Ink','💳'],['apple','Apple Card','🍎'],['heloc','HELOC','🏠']];
  const payDebt = (k, label) => {
    const v = parseFloat(payAmt[k]); if (!v || v <= 0) return;
    const cur = Number(accts[k]) || 0;
    const next = { ...accts, [k]: Math.max(0, Math.round((cur - v) * 100) / 100) };
    setAccts(next);
    saveBudget({ accounts: recomputeTotals(next) });
    setPayAmt(a => ({ ...a, [k]: '' }));
    setToast(`💳 ${$(v)} paid toward ${label} — now ${$(next[k])}`);
    setTimeout(() => setToast(null), 2800);
  };
  const totalDebtNow = DEBTS.reduce((s,[k]) => s + (Number(accts[k]) || 0), 0);

  const persist = (next) => {
    setGoals(next);
    const forSave = next.map(({ _id, ...g }) => ({ ...g, id: _id }));
    D.goals = forSave;
    db.saveBudgetData({
      date: D.date, cycle: D.cycle, accounts: D.accounts, income: D.income,
      grocery: D.grocery, fixedBills: D.fixedBills, fixedBillsList: D.fixedBillsList,
      variableSpend: D.variableSpend, deficit: D.deficit, spending: D.spending,
      goals: forSave,
    }).catch(err => console.error('saveGoals failed:', err));
  };

  const now = new Date();
  const inThisMonth = (iso) => { const d = new Date(iso); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); };

  const totalSaved = goals.reduce((s,g)=>s+g.saved,0);
  const totalTarget = goals.reduce((s,g)=>s+g.target,0);
  const allocatedThisMonth = goals.reduce((s,g)=> s + g.contributions.filter(c=>inThisMonth(c.date)).reduce((t,c)=>t+(Number(c.amount)||0),0), 0);
  const monthlySurplus = (typeof D.deficit === 'number') ? D.deficit : ((D.income?.total||0) - (D.fixedBills||0) - (D.variableSpend||0));
  const remainingToAllocate = Math.round((monthlySurplus - allocatedThisMonth)*100)/100;

  const contribute = (id) => {
    const v = parseFloat(amt[id]); if (!v || v <= 0) return;
    const next = goals.map(g => g._id===id
      ? { ...g, saved: Math.round((g.saved+v)*100)/100, contributions: [...g.contributions, { date: new Date().toISOString(), amount: v }] }
      : g);
    const g = next.find(x=>x._id===id);
    persist(next);
    setAmt(a => ({ ...a, [id]: '' }));
    setToast(`🎉 ${$(v)} toward ${g.name}` + (g.target>0 && g.saved>=g.target ? ' — goal reached! 🥳' : ''));
    setTimeout(()=>setToast(null), 2800);
  };
  const undoLast = (id) => persist(goals.map(g => {
    if (g._id!==id || !g.contributions.length) return g;
    const last = g.contributions[g.contributions.length-1];
    return { ...g, saved: Math.round((g.saved-(Number(last.amount)||0))*100)/100, contributions: g.contributions.slice(0,-1) };
  }));
  const updateGoal = (id, k, v) => persist(goals.map(g => g._id===id ? { ...g, [k]: (k==='target'||k==='saved') ? (parseFloat(v)||0) : v } : g));
  const deleteGoal = (id) => persist(goals.filter(g => g._id!==id));
  const addGoal = () => {
    if (!newGoal.name.trim()) return;
    persist([...goals, { _id:`g_${Date.now()}`, icon:newGoal.icon||'🎯', name:newGoal.name.trim(), target:parseFloat(newGoal.target)||0, saved:0, note:'', contributions:[] }]);
    setNewGoal({ name:'', target:'', icon:'🎯' }); setAdding(false);
  };

  const recent = goals.flatMap(g => g.contributions.map(c => ({ ...c, goal:g.name, icon:g.icon })))
    .sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6);
  const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); } catch { return ''; } };
  const overallPct = totalTarget>0 ? Math.min(100, Math.round((totalSaved/totalTarget)*100)) : 0;

  const field = { border:`1px solid ${T.border}`, borderRadius:10, padding:'8px 12px', fontSize:14, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink };

  return (
    <div style={{ padding:'clamp(20px,5vw,32px) clamp(16px,5vw,48px)', maxWidth: 920, margin:'0 auto' }}>
      {toast && (
        <div style={{ position:'fixed', top:18, left:'50%', transform:'translateX(-50%)', background:T.green, color:'#fff', padding:'10px 20px', borderRadius:100, fontSize:14, fontWeight:700, boxShadow:'0 6px 24px rgba(0,0,0,0.18)', zIndex:2000 }}>{toast}</div>
      )}

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12, flexWrap:'wrap', marginBottom: 20 }}>
        <SectionHeader tag="Surplus → Progress" tagColor={monthlySurplus>=0?'green':'amber'}
          title="Allocate" sub="Put any surplus to work — savings goals, one-off plans (Christmas), or paying down debt." />
        <button onClick={()=>onGo('incomebills')} style={{ background: T.ink, color:'#fff', border:'none', borderRadius:100, padding:'9px 18px', fontSize:13, fontWeight:700, cursor:'pointer', flexShrink:0, marginTop:4 }}>🔧 Income &amp; bills</button>
      </div>

      {/* SURPLUS */}
      <Card style={{
        background: monthlySurplus>=0 ? 'linear-gradient(135deg,#173528 0%,#265842 100%)' : T.amberBg,
        border: monthlySurplus>=0 ? 'none' : `1px solid ${T.amberMid}`, color: monthlySurplus>=0 ? '#fff' : T.ink,
        padding:'26px 24px', marginBottom: 16
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', flexWrap:'wrap', gap:12 }}>
          <div>
            <p style={{ fontSize: 12, letterSpacing:1.2, textTransform:'uppercase', opacity: monthlySurplus>=0?.65:1, color: monthlySurplus>=0?'#fff':T.amber, fontWeight:700, marginBottom:6 }}>
              {monthlySurplus>=0 ? 'Monthly surplus to put to work' : 'The plan runs short right now'}
            </p>
            <p style={{ fontSize:'clamp(34px,8vw,52px)', fontWeight:800, letterSpacing:-1.5, lineHeight:1, color: monthlySurplus>=0?'#fff':T.coral }}>
              {monthlySurplus>=0 ? '' : '−'}{$(Math.abs(monthlySurplus))}<span style={{ fontSize:18, fontWeight:600, opacity:.6 }}>/mo</span>
            </p>
          </div>
          <div style={{ textAlign:'right' }}>
            <p style={{ fontSize:12, opacity:.7 }}>Put toward goals this month</p>
            <p style={{ fontSize:24, fontWeight:800 }}>{$(allocatedThisMonth)}</p>
            {monthlySurplus>0 && <p style={{ fontSize:12, opacity:.75, marginTop:2 }}>{remainingToAllocate>0 ? `${$(remainingToAllocate)} still free to allocate` : 'Fully allocated 🎉'}</p>}
          </div>
        </div>
        <p style={{ fontSize:13, marginTop:14, opacity: monthlySurplus>=0?.8:1, lineHeight:1.6 }}>
          {monthlySurplus>=0
            ? 'Income minus fixed bills and variable spending, if the month goes to plan. Make sure This Month shows Billing covered before moving cash to savings.'
            : 'Covering the month comes first — see This Month. On any surplus month, send the extra here.'}
        </p>
      </Card>

      {/* OVERALL PROGRESS */}
      <Card style={{ marginBottom: 16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
          <p style={{ fontWeight:700 }}>Total saved toward goals</p>
          <p style={{ fontSize:20, fontWeight:800, color:T.green }}>{$(totalSaved)} <span style={{ fontSize:13, color:T.dim, fontWeight:600 }}>of {$(totalTarget)}</span></p>
        </div>
        <Bar val={totalSaved} max={totalTarget||1} color={T.green} h={12} />
        <p style={{ fontSize:12, color:T.dim, marginTop:6 }}>{overallPct}% of the way there across {goals.length} goal{goals.length!==1?'s':''}.</p>
      </Card>

      {/* GOAL CARDS */}
      <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:16 }}>
        {goals.map(g => {
          const pct = g.target>0 ? Math.min(100, Math.round((g.saved/g.target)*100)) : 0;
          const done = g.target>0 && g.saved>=g.target;
          const remaining = Math.max(0, g.target - g.saved);
          const editing = editId===g._id;
          return (
            <Card key={g._id} style={{ border:`1px solid ${done?T.greenMid:T.border}`, background: done?T.greenBg:T.card }}>
              <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:10 }}>
                <span style={{ fontSize:26 }}>{g.icon}</span>
                <div style={{ flex:1, minWidth:0 }}>
                  {editing
                    ? <input value={g.name} onChange={e=>updateGoal(g._id,'name',e.target.value)} style={{ ...field, width:'100%', fontWeight:700 }} />
                    : <p style={{ fontWeight:800, fontSize:16 }}>{g.name} {done && <span style={{ color:T.green }}>🎉</span>}</p>}
                  {!editing && (g.note || g.dueDate) && <p style={{ fontSize:12, color:T.dim }}>{g.note}{g.note&&g.dueDate?' · ':''}{g.dueDate ? `🗓 by ${(()=>{try{return new Date(g.dueDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});}catch{return g.dueDate;}})()}` : ''}</p>}
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <p style={{ fontWeight:800, fontSize:16, color: done?T.green:T.ink }}>{$(g.saved)}</p>
                  <p style={{ fontSize:11, color:T.dim }}>of {editing ? '' : $(g.target)}
                    {editing && <input type="number" value={g.target} onChange={e=>updateGoal(g._id,'target',e.target.value)} style={{ ...field, width:90, padding:'4px 8px', textAlign:'right' }} />}
                  </p>
                </div>
              </div>

              <Bar val={g.saved} max={g.target||1} color={done?T.green:T.purple} h={10} />
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:T.dim, marginTop:5 }}>
                <span>{pct}%{!done && remaining>0 ? ` · ${$(remaining)} to go` : ''}</span>
                <span>{g.contributions.length} contribution{g.contributions.length!==1?'s':''}</span>
              </div>

              {!editing && (
                <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:12, flexWrap:'wrap' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                    <span style={{ color:T.dim, fontSize:14 }}>$</span>
                    <input type="number" inputMode="decimal" placeholder="amount" value={amt[g._id]||''}
                      onChange={e=>setAmt(a=>({ ...a, [g._id]: e.target.value }))}
                      onKeyDown={e=>e.key==='Enter'&&contribute(g._id)}
                      style={{ ...field, width:110, textAlign:'right' }} />
                  </div>
                  <button onClick={()=>contribute(g._id)} style={{ background:T.green, color:'#fff', border:'none', borderRadius:10, padding:'9px 18px', fontSize:14, fontWeight:700, cursor:'pointer' }}>+ Add contribution</button>
                  {[100,250,500].map(q => (
                    <button key={q} onClick={()=>setAmt(a=>({ ...a, [g._id]: String((parseFloat(a[g._id])||0)+q) }))}
                      style={{ background:T.card, color:T.dim, border:`1px solid ${T.border}`, borderRadius:100, padding:'6px 12px', fontSize:12, fontWeight:700, cursor:'pointer' }}>+{q}</button>
                  ))}
                  {g.contributions.length>0 && <button onClick={()=>undoLast(g._id)} style={{ marginLeft:'auto', background:'none', border:'none', color:T.dim, fontSize:12, cursor:'pointer', textDecoration:'underline' }}>undo last</button>}
                  <button onClick={()=>setEditId(g._id)} style={{ background:'none', border:'none', color:T.dim, fontSize:13, cursor:'pointer' }}>✏️</button>
                </div>
              )}
              {editing && (
                <div style={{ display:'flex', flexDirection:'column', gap:10, marginTop:12 }}>
                  <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' }}>
                    <span style={{ fontSize:12, color:T.dim }}>Icon</span>
                    {GOAL_ICONS.map(ic => (
                      <button key={ic} onClick={()=>updateGoal(g._id,'icon',ic)} style={{ background: g.icon===ic?T.greenBg:'transparent', border:`1px solid ${g.icon===ic?T.greenMid:T.border}`, borderRadius:8, padding:'3px 6px', fontSize:16, cursor:'pointer' }}>{ic}</button>
                    ))}
                  </div>
                  <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
                    <span style={{ fontSize:12, color:T.dim }}>Target date (one-offs)</span>
                    <input type="date" value={g.dueDate || ''} onChange={e=>updateGoal(g._id,'dueDate', e.target.value||undefined)} style={{ ...field, padding:'6px 10px' }} />
                    <button onClick={()=>deleteGoal(g._id)} style={{ background:T.coralBg, color:T.coral, border:`1px solid ${T.coralMid}`, borderRadius:10, padding:'7px 14px', fontSize:13, fontWeight:700, cursor:'pointer' }}>Delete</button>
                    <button onClick={()=>setEditId(null)} style={{ marginLeft:'auto', background:T.ink, color:'#fff', border:'none', borderRadius:10, padding:'7px 16px', fontSize:13, fontWeight:700, cursor:'pointer' }}>Done</button>
                  </div>
                </div>
              )}
            </Card>
          );
        })}
      </div>

      {/* ADD GOAL */}
      {adding ? (
        <Card style={{ marginBottom:16 }}>
          <p style={{ fontWeight:700, marginBottom:10 }}>New goal</p>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:10 }}>
            <input placeholder="Goal name" value={newGoal.name} onChange={e=>setNewGoal(n=>({ ...n, name:e.target.value }))} style={{ ...field, flex:'1 1 160px' }} />
            <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <span style={{ color:T.dim }}>$</span>
              <input type="number" placeholder="target" value={newGoal.target} onChange={e=>setNewGoal(n=>({ ...n, target:e.target.value }))} style={{ ...field, width:120, textAlign:'right' }} />
            </div>
          </div>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center', marginBottom:12 }}>
            {GOAL_ICONS.map(ic => (
              <button key={ic} onClick={()=>setNewGoal(n=>({ ...n, icon:ic }))} style={{ background: newGoal.icon===ic?T.greenBg:'transparent', border:`1px solid ${newGoal.icon===ic?T.greenMid:T.border}`, borderRadius:8, padding:'3px 7px', fontSize:17, cursor:'pointer' }}>{ic}</button>
            ))}
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <button onClick={addGoal} style={{ background:T.green, color:'#fff', border:'none', borderRadius:10, padding:'9px 20px', fontSize:14, fontWeight:700, cursor:'pointer' }}>Add goal</button>
            <button onClick={()=>{ setAdding(false); setNewGoal({ name:'', target:'', icon:'🎯' }); }} style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:10, padding:'9px 18px', fontSize:14, cursor:'pointer', color:T.dim }}>Cancel</button>
          </div>
        </Card>
      ) : (
        <button onClick={()=>setAdding(true)} style={{ background:T.greenBg, color:T.green, border:`1px solid ${T.greenMid}`, borderRadius:12, padding:'11px 20px', fontSize:14, fontWeight:700, cursor:'pointer', marginBottom:16 }}>+ Add a goal</button>
      )}

      {/* DEBT PAYDOWN */}
      <p style={{ fontSize:12, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, margin:'22px 0 10px' }}>Pay down debt</p>
      <Card style={{ marginBottom:16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <span style={{ fontWeight:700 }}>Total owed</span>
          <span style={{ fontSize:20, fontWeight:800, color:T.coral }}>−{$(totalDebtNow)}</span>
        </div>
        {DEBTS.map(([k,label,icon]) => {
          const bal = Number(accts[k]) || 0;
          return (
            <div key={k} style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 0', borderTop:`1px solid ${T.border}`, flexWrap:'wrap' }}>
              <span style={{ fontSize:16 }}>{icon}</span>
              <div style={{ flex:'1 1 120px', minWidth:0 }}>
                <p style={{ fontSize:14, fontWeight:600 }}>{label}</p>
                <p style={{ fontSize:12, color: bal>0?T.coral:T.green }}>{bal>0 ? `${$$(bal)} owed` : 'Paid off 🎉'}</p>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <span style={{ color:T.dim, fontSize:14 }}>$</span>
                <input type="number" inputMode="decimal" placeholder="pay" value={payAmt[k]||''}
                  onChange={e=>setPayAmt(a=>({ ...a, [k]: e.target.value }))}
                  onKeyDown={e=>e.key==='Enter'&&payDebt(k,label)}
                  style={{ ...field, width:84, textAlign:'right' }} />
              </div>
              <button onClick={()=>payDebt(k,label)} disabled={bal<=0} style={{ background: bal>0?T.ink:T.border, color:'#fff', border:'none', borderRadius:10, padding:'8px 14px', fontSize:13, fontWeight:700, cursor: bal>0?'pointer':'default' }}>Pay</button>
            </div>
          );
        })}
      </Card>

      {/* RECENT ACTIVITY */}
      {recent.length>0 && (
        <Card>
          <p style={{ fontWeight:700, marginBottom:10 }}>Recent progress 🎉</p>
          {recent.map((c,i) => (
            <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:`1px solid ${T.border}` }}>
              <span style={{ fontSize:16 }}>{c.icon}</span>
              <span style={{ flex:1, fontSize:13 }}>{c.goal}</span>
              <span style={{ fontSize:12, color:T.dim }}>{fmtDate(c.date)}</span>
              <span style={{ fontSize:13, fontWeight:700, color:T.green, width:80, textAlign:'right' }}>+{$(Number(c.amount)||0)}</span>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
};

// ─── SCREEN: TRANSFERS ───────────────────────────────────────────────────────
// Money moved between our own accounts. Three lenses on one list:
//  • sinking funds (fund.dueDate) — on track to hit a dated target?
//  • savings goals (fund, no dueDate) — progress toward a target
//  • monthly spend transfers (no fund) — e.g. the weekly grocery envelope
const TRANSFER_ACCTS = [['groceries','Groceries'],['propertyTax','Property Tax'],['emergency','E-Save'],['opFunSavings','Fun Savings'],['baselane','Baselane'],['personalClearing','Personal Clearing']];

const Transfers = ({ onGo }) => {
  const narrow = useIsNarrow();
  const [transfers, setTransfers] = useState(() => (D.transfers || []).map((t,i)=>({ ...t, _id: t.id || `t_${i}` })));
  const [editId, setEditId] = useState(null);

  const persist = (next) => {
    setTransfers(next);
    const forSave = next.map(({ _id, ...t }) => ({ ...t, id: _id }));
    D.transfers = forSave;
    db.saveBudgetData({
      date:D.date, cycle:D.cycle, accounts:D.accounts, income:D.income, grocery:D.grocery,
      fixedBills:D.fixedBills, fixedBillsList:D.fixedBillsList, variableSpend:D.variableSpend,
      deficit:D.deficit, spending:D.spending, goals:D.goals, transfers:forSave,
    }).catch(e=>console.error('saveTransfers failed:', e));
  };
  const upd = (id, patch) => persist(transfers.map(t => t._id===id ? { ...t, ...patch } : t));
  const updFund = (id, patch) => persist(transfers.map(t => t._id===id ? { ...t, fund: { ...(t.fund||{}), ...patch } } : t));
  const del = (id) => persist(transfers.filter(t => t._id!==id));
  const addT = (withFund) => { const id=`t_${Date.now()}`; persist([...transfers, { _id:id, label: withFund?'New savings goal':'New transfer', amount:0, to:'emergency', cadence:'monthly', day:1, ...(withFund?{fund:{target:0}}:{}) }]); setEditId(id); };

  const acctLabel = k => (TRANSFER_ACCTS.find(a=>a[0]===k)||[null,k])[1];
  const cadenceDesc = (t) => t.cadence==='weekly' ? `every ${WEEKDAYS[t.weekday ?? 5]}` : t.cadence==='semimonthly' ? `twice monthly (${(t.days||[15,30]).filter(x=>x!=null).join(' & ')})` : 'monthly';
  const perLabel = (t) => t.cadence==='weekly' ? '/wk' : t.cadence==='semimonthly' ? ' ea' : '/mo';
  const fmtMonth = (iso) => { try { return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'}); } catch { return iso; } };
  const monthlyOut = transfers.filter(t=>!t.paused).reduce((s,t)=> s + monthlyEquivalent(t), 0);

  const funds = transfers.filter(t => t.fund);
  const plain = transfers.filter(t => !t.fund);

  const field = { border:`1px solid ${T.border}`, borderRadius:10, padding:'8px 12px', fontSize:14, fontFamily:'inherit', outline:'none', background:'#fff', color:T.ink, width:'100%' };

  const AmountRow = ({ t }) => (
    <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
      <span style={{ color:T.dim, fontSize:14 }}>$</span>
      <input type="number" inputMode="decimal" value={t.amount} onChange={e=>upd(t._id,{ amount: parseFloat(e.target.value)||0 })} style={{ ...field, width:92, textAlign:'right' }} />
      <span style={{ color:T.dim, fontSize:12 }}>{perLabel(t)}</span>
    </div>
  );

  const Editor = ({ t }) => (
    <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${T.border}`, display:'flex', flexDirection:'column', gap:10 }}>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
        <div style={{ flex:'1 1 150px' }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>Label</span>
          <input value={t.label} onChange={e=>upd(t._id,{label:e.target.value})} style={field} /></div>
        <div style={{ width:140 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>To account</span>
          <select value={t.to} onChange={e=>upd(t._id,{to:e.target.value})} style={{ ...field, padding:'8px 8px' }}>
            {TRANSFER_ACCTS.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select></div>
      </div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'flex-end' }}>
        <div style={{ width:150 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>How often</span>
          <select value={t.cadence} onChange={e=>{ const v=e.target.value; upd(t._id,{ cadence:v, ...(v==='semimonthly'&&!(t.days&&t.days.length)?{days:[15,30]}:{}), ...(v==='weekly'&&t.weekday==null?{weekday:5}:{}) }); }} style={{ ...field, padding:'8px 8px' }}>
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly (a weekday)</option>
            <option value="semimonthly">Twice a month</option>
          </select></div>
        {t.cadence==='monthly' && (
          <div style={{ width:84 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>Day</span>
            <input type="number" inputMode="numeric" min="1" max="31" value={t.day ?? ''} onChange={e=>upd(t._id,{day: e.target.value===''?null:Math.max(1,Math.min(31,parseInt(e.target.value)||1))})} style={{ ...field, textAlign:'center' }} /></div>
        )}
        {t.cadence==='weekly' && (
          <div style={{ width:140 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>On</span>
            <select value={t.weekday ?? 5} onChange={e=>upd(t._id,{weekday:parseInt(e.target.value)})} style={{ ...field, padding:'8px 8px' }}>
              {WEEKDAYS.map((w,i)=><option key={i} value={i}>{w}</option>)}
            </select></div>
        )}
        {t.cadence==='semimonthly' && (
          <div style={{ display:'flex', alignItems:'flex-end', gap:6 }}>
            {[0,1].map(i => (
              <div key={i} style={{ width:70 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>Day {i+1}</span>
                <input type="number" inputMode="numeric" min="1" max="31" value={(t.days&&t.days[i]) ?? ''} onChange={e=>{ const days=[...(t.days||[15,30])]; days[i]=e.target.value===''?null:Math.max(1,Math.min(31,parseInt(e.target.value)||1)); upd(t._id,{days}); }} style={{ ...field, textAlign:'center' }} /></div>
            ))}
            <button onClick={()=>upd(t._id,{days:[15,30]})} style={{ background:T.greenBg, color:T.green, border:`1px solid ${T.greenMid}`, borderRadius:8, padding:'8px 10px', fontSize:11, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>mirror paychecks</button>
          </div>
        )}
        {t.fund && (<>
          <div style={{ width:120 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>Target $</span>
            <input type="number" inputMode="decimal" value={t.fund.target ?? ''} onChange={e=>updFund(t._id,{target:parseFloat(e.target.value)||0})} style={{ ...field, textAlign:'right' }} /></div>
          <div style={{ width:160 }}><span style={{ fontSize:11, color:T.dim, fontWeight:700 }}>Due date (optional)</span>
            <input type="date" value={t.fund.dueDate || ''} onChange={e=>updFund(t._id,{dueDate:e.target.value||undefined})} style={{ ...field }} /></div>
        </>)}
      </div>
      <div style={{ display:'flex', gap:8 }}>

const SCREENS = [
  { id:'today',       label:'Today',           comp: Today },
  { id:'flow',        label:'This Month',      comp: CashFlowTimeline },
  { id:'transfers',   label:'Transfers',       comp: Transfers },
  { id:'incomebills', label:'Income & Bills',  comp: IncomeBills },
  { id:'goals',       label:'Allocate',        comp: GoalsProgress },
  { id:'ourlist',     label:'Our Lists',       comp: OurListsScreen },
];

const HASH_ALIASES = { lists: 'ourlist' };
const hashToIdx = () => {
  try {
    const raw = window.location.hash.replace('#', '').toLowerCase();
    const id = HASH_ALIASES[raw] || raw;
    const i = SCREENS.findIndex(s => s.id === id);
    return i >= 0 ? i : null;
  } catch { return null; }
};

const App = () => {
  const [ready, setReady] = useState(false);
  const [idx, setIdx] = useState(() => {
    const fromHash = hashToIdx();
    if (fromHash !== null) return fromHash;
    try { const n = parseInt(localStorage.getItem('moneydate_screen') || '0', 10); return (n >= 0 && n < SCREENS.length) ? n : 0; } catch { return 0; }
  });

  useEffect(() => {
    const fallback = setTimeout(() => setReady(true), 8000);
    db.init()
      .then(() => { clearTimeout(fallback); setReady(true); })
      .catch(err => { clearTimeout(fallback); console.error('Supabase init failed:', err); setReady(true); });
  }, []);

  useEffect(() => {
    const onHashChange = () => {
      const i = hashToIdx();
      if (i !== null) { setIdx(i); localStorage.setItem('moneydate_screen', i); }
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  // Force iOS Safari to repaint and reset scroll after every screen change.
  // Without this, navigating screens leaves a blank cream screen (GPU layer
  // not invalidated after position:fixed elements unmount).
  useEffect(() => {
    const el = document.querySelector('[data-scroll]');
    if (!el) return;
    el.scrollTop = 0;
    el.style.webkitTransform = 'translateZ(0)';
    const id = requestAnimationFrame(() => { el.style.webkitTransform = ''; });
    return () => cancelAnimationFrame(id);
  }, [idx]);

  const go = (n) => {
    const c = Math.max(0, Math.min(SCREENS.length-1, n));
    setIdx(c);
    localStorage.setItem('moneydate_screen', c);
    window.location.hash = SCREENS[c].id;
  };
  const S = SCREENS[idx];
  const goId = (id) => { const i = SCREENS.findIndex(s => s.id === id); if (i >= 0) go(i); };
  const fullBleed = S.id === 'ourlist';

  if (!ready) return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100vh', background:'#FAF7F2', gap:16 }}>
      <p style={{ fontSize:36 }}>💚</p>
      <p style={{ fontFamily:"'Playfair Display', serif", fontSize:22, fontWeight:700, color:'#1C1C1E' }}>Cadence</p>
      <p style={{ fontSize:14, color:'#6B6B70' }}>Loading…</p>
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background: T.cream, overflow:'hidden' }}>
      {!fullBleed && (
        <nav style={{ display:'flex', alignItems:'center', gap:4, padding:'10px clamp(12px,4vw,32px)', borderBottom:`1px solid ${T.border}`, background:'#FFF', flexShrink:0, overflowX:'auto', WebkitOverflowScrolling:'touch' }}>
          <span style={{ color: T.green, fontSize:16, marginRight:4, flexShrink:0 }}>💚</span>
          {SCREENS.map((s,i) => (
            <button key={s.id} onClick={()=>go(i)} style={{
              background: idx===i ? T.ink : 'transparent', color: idx===i ? '#fff' : T.dim,
              border:'none', borderRadius:100, padding:'6px 14px', fontSize:13, whiteSpace:'nowrap', flexShrink:0,
              fontWeight: idx===i ? 700 : 500, cursor:'pointer', transition:'all .15s'
            }}>{s.label}</button>
          ))}
        </nav>
      )}

      <PullToRefresh>
        {S.comp ? <S.comp onGo={goId} onGoHome={()=>go(0)} /> : null}
      </PullToRefresh>
    </div>
  );
};

  }, []);

    try {
      const data = await db.addTodo(tab, text, items[tab].length);
      setItems(prev => ({ ...prev, [tab]: [...prev[tab], { id: data.id, text, done: false }] }));
      setInput('');
    } catch (err) {
      console.error('addTodo failed:', err);
      setAddError('Failed to save — check connection');
      setTimeout(() => setAddError(null), 4000);
    }
  };
  const toggle = (person, id) => {
    const done = !items[person].find(i => i.id === id).done;
    setItems(prev => ({ ...prev, [person]: prev[person].map(i => i.id === id ? { ...i, done } : i) }));
    db.toggleTodo(id, done);
  };
  const remove = (person, id) => {
    setItems(prev => ({ ...prev, [person]: prev[person].filter(i => i.id !== id) }));
    db.deleteTodo(id);
  };
  const updatePriority = (i, val) => {
    const n = [...priorities]; n[i] = val; setPriorities(n);
    db.savePriority(i + 1, val);
  };
  const addNote = async () => {
    const text = noteInput.trim(); if (!text) return;
    try {
      const data = await db.addNote(text, notesList.length);
      setNotesList(prev => [...prev, { id: data.id, text }]);
      setNoteInput('');
    } catch (err) {
      console.error('addNote failed:', err);
      setAddError('Failed to save — check connection');
      setTimeout(() => setAddError(null), 4000);
    }
  };
  const removeNote = (id) => {
    setNotesList(prev => prev.filter(n => n.id !== id));
    db.deleteNote(id);
  };

  const share = () => {
    const date = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
    const lines = ['=== STEWART FAMILY MONEY DATE ===', date, ''];
    lines.push('--- CHAD\'S TO-DOS ---');
    if (items.chad.length) items.chad.forEach(i => lines.push((i.done ? '[x] ' : '[ ] ') + i.text));
    else lines.push('(none)');
    lines.push('');
    lines.push('--- JOELLE\'S TO-DOS ---');
    if (items.joelle.length) items.joelle.forEach(i => lines.push((i.done ? '[x] ' : '[ ] ') + i.text));
    else lines.push('(none)');
    lines.push('');
    lines.push('--- PRIORITIES ---');
    priorities.forEach((p, i) => { if (p.trim()) lines.push(`Goal #${i+1}: ${p}`); });
    lines.push('');
    if (notesList.length) {
      lines.push('--- NOTES ---');
      notesList.forEach((n, i) => lines.push(`${i+1}. ${n.text}`));
    }
    const text = lines.join('\n').trim();
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 3000);
    }).catch(() => { window.prompt('Copy and paste to save:', text); });
  };

  // Export the full financial picture + lists as a prompt + JSON block,
  // ready to paste straight into a Claude chat for a Money Date debrief.
  const shareForClaude = () => {
    const round = (n) => Math.round((parseFloat(n) || 0) * 100) / 100;
    const netMonthly = round(D.income.total - D.fixedBills - D.variableSpend);
    const snapshot = {
      exportedAt: new Date().toISOString(),
      asOfDate: D.date,
      monthly: {
        income: round(D.income.total),
        fixedBills: round(D.fixedBills),
        variableSpend: round(D.variableSpend),
        netMonthly,                       // positive = surplus, negative = deficit
        statedDeficit: round(D.deficit),
      },
      accounts: D.accounts,
      incomeSources: D.income.sources,
      fixedBillsList: D.fixedBillsList.map(b => ({ name: b.name, amount: round(b.amount), note: b.note || '' })),
      variableSpending: D.spending.map(s => ({ category: s.cat, monthly: round(s.mo), note: s.note || '', adjustable: !!s.lever })),
      debt: { sapphire: D.accounts.sapphire, ink: D.accounts.ink, totalDebt: D.accounts.totalDebt },
      goals: D.goals.map(g => ({ name: g.name, saved: g.saved, target: g.target, note: g.note || '' })),
      actionItems: D._actions || [],
      lists: {
        chadTodos: items.chad.map(i => ({ text: i.text, done: i.done })),
        joelleTodos: items.joelle.map(i => ({ text: i.text, done: i.done })),
        priorities: priorities.filter(p => p.trim()),
        notes: notesList.map(n => n.text),
      },
    };
    const prompt = [
      "We're Chad & Joelle Stewart, doing our regular \"Money Date\" — a budget review session. Below is a JSON snapshot from our finance app (Cadence) as of " + D.date + ".",
      "",
      "On paper the numbers look manageable, but our bank account keeps running tight / empty. Help us understand the gap. Specifically:",
      "  • Walk through where the money actually goes each month vs. what comes in.",
      "  • Flag anything that explains \"looks fine on paper but no cash\" — timing of income vs. bills, variable spending creep, debt interest, one-off costs, etc.",
      "  • Point out the 2–3 highest-impact changes we could make, warmly and without judgment.",
      "",
      "Use \"we\" language and keep it encouraging — we want to feel in control, not anxious.",
      "",
      "```json",
      JSON.stringify(snapshot, null, 2),
      "```",
    ].join('\n');
    navigator.clipboard.writeText(prompt).then(() => {
      setCopiedAI(true); setTimeout(() => setCopiedAI(false), 3000);
    }).catch(() => { window.prompt('Copy this and paste into a Claude chat:', prompt); });
  };

  const totalCount = items.chad.length + items.joelle.length;
  const doneCount = items.chad.filter(i=>i.done).length + items.joelle.filter(i=>i.done).length;

  const TABS = [
    { id:'chad', label:'👦 Chad' },
    { id:'joelle', label:'👩 Joelle' },
    { id:'goals', label:'📌 Goals' },
  ];

  return (
    <>
      <button onClick={() => setOpen(o => !o)} style={{
        position:'fixed', bottom: 76, right: 24, width: 52, height: 52, borderRadius:'50%',
        background: open ? T.ink : T.green, color:'#fff', border:'none', cursor:'pointer',
        fontSize: 20, boxShadow:'0 4px 16px rgba(0,0,0,0.18)', zIndex: 1000,
        display:'flex', alignItems:'center', justifyContent:'center', transition:'all .2s'
      }}>
        {open ? '✕' : '✅'}
        {!open && totalCount > 0 && (
          <span style={{ position:'absolute', top:-4, right:-4, background: T.coral, color:'#fff', borderRadius:'50%', width:18, height:18, fontSize:10, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center' }}>
            {totalCount - doneCount > 0 ? totalCount - doneCount : '✓'}
          </span>
        )}
      </button>

      {open && (
        <div style={{
          position:'fixed', bottom: 136, right: 24, width: 380, maxHeight: 560,
          background:'#fff', borderRadius: 20, boxShadow:'0 8px 40px rgba(0,0,0,0.18)',
          border:`1px solid ${T.border}`, zIndex: 999, display:'flex', flexDirection:'column', overflow:'hidden'
        }}>
          <div style={{ padding:'14px 18px 10px', borderBottom:`1px solid ${T.border}`, flexShrink:0 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
              <p style={{ fontWeight:800, fontSize:15 }}>💚 Cadence</p>
              {loading
                ? <span style={{ fontSize:11, color:T.dim }}>Syncing…</span>
                : <span style={{ fontSize:12, color:T.dim }}>{doneCount}/{totalCount} done</span>}
            </div>
            <div style={{ display:'flex', background:'#F4F1EC', borderRadius:10, padding:3, gap:2 }}>
              {TABS.map(t => (
                <button key={t.id} onClick={()=>setTab(t.id)} style={{
                  flex:1, background: tab===t.id ? '#fff' : 'transparent',
                  border:'none', borderRadius:8, padding:'5px 4px', fontSize:11.5, fontWeight:700,
                  color: tab===t.id ? T.ink : T.dim, cursor:'pointer', transition:'all .15s',
                  boxShadow: tab===t.id ? '0 1px 4px rgba(0,0,0,0.08)' : 'none', whiteSpace:'nowrap'
                }}>{t.label}{(t.id==='chad'||t.id==='joelle') && items[t.id].length > 0 ? ` (${items[t.id].filter(i=>i.done).length}/${items[t.id].length})` : ''}</button>
              ))}
            </div>
          </div>

          {(tab === 'chad' || tab === 'joelle') && (
            <>
              <div style={{ flex:1, overflowY:'auto', padding:'10px 16px' }}>
                {items[tab].length === 0 && <p style={{ fontSize:13, color:T.dim, textAlign:'center', padding:'20px 0' }}>No items yet — add one below</p>}
                {items[tab].map(item => (
                  <div key={item.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 4px', borderBottom:`1px solid ${T.border}` }}>
                    <CheckBox checked={item.done} onChange={()=>toggle(tab, item.id)} size={20} />
                    <p style={{ flex:1, fontSize:13, color: item.done ? T.dim : T.ink, textDecoration: item.done ? 'line-through' : 'none', lineHeight:1.4 }}>{item.text}</p>
                    <button onClick={()=>remove(tab, item.id)} style={{ background:'none', border:'none', cursor:'pointer', color:T.border, fontSize:16, padding:'0 2px', lineHeight:1 }}>×</button>
                  </div>
                ))}
              </div>
              <div style={{ padding:'10px 14px', borderTop:`1px solid ${T.border}`, flexShrink:0 }}>
                {addError && <p style={{ fontSize:11, color:T.coral, marginBottom:6 }}>{addError}</p>}
                <div style={{ display:'flex', gap:8 }}>
                  <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}
                    placeholder={`Add ${tab==='chad'?'Chad':'Joelle'}'s item...`}
                    style={{ flex:1, border:`1px solid ${T.border}`, borderRadius:10, padding:'8px 12px', fontSize:13, outline:'none', fontFamily:'inherit' }} />
                  <button onClick={add} style={{ background:T.green, color:'#fff', border:'none', borderRadius:10, padding:'8px 14px', fontSize:13, fontWeight:700, cursor:'pointer' }}>+</button>
                </div>
              </div>
            </>
          )}

          {tab === 'goals' && (
            <div style={{ flex:1, overflowY:'auto', padding:'14px 16px' }}>
              <p style={{ fontSize:11, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:10 }}>Our 3 Priorities</p>
              <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:18 }}>
                {priorities.map((p, i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10, background:T.greenBg, border:`1px solid ${T.greenMid}`, borderRadius:12, padding:'10px 14px' }}>
                    <span style={{ fontSize:13, fontWeight:800, color:T.green, flexShrink:0 }}>#{i+1}</span>
                    <input value={p} onChange={e=>updatePriority(i, e.target.value)} placeholder={`Priority #${i+1}...`}
                      style={{ flex:1, border:'none', outline:'none', background:'transparent', fontFamily:'inherit', fontSize:13, color:T.ink }} />
                  </div>
                ))}
              </div>
              <p style={{ fontSize:11, fontWeight:800, letterSpacing:1, textTransform:'uppercase', color:T.dim, marginBottom:8 }}>Notes</p>
              {notesList.map((n, i) => (
                <div key={n.id} style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'8px 4px', borderBottom:`1px solid ${T.border}` }}>
                  <span style={{ fontSize:12, color:T.dim, marginTop:2, flexShrink:0 }}>{i+1}.</span>
                  <p style={{ flex:1, fontSize:13, color:T.ink, lineHeight:1.4 }}>{n.text}</p>
                  <button onClick={()=>removeNote(n.id)} style={{ background:'none', border:'none', cursor:'pointer', color:T.border, fontSize:16, padding:'0 2px', lineHeight:1 }}>×</button>
                </div>
              ))}
              {addError && <p style={{ fontSize:11, color:T.coral, margin:'4px 0' }}>{addError}</p>}
              <div style={{ display:'flex', gap:8, marginTop:10 }}>
                <input value={noteInput} onChange={e=>setNoteInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNote()}
                  placeholder="Add a note..."
                  style={{ flex:1, border:`1px solid ${T.border}`, borderRadius:10, padding:'8px 12px', fontSize:13, outline:'none', fontFamily:'inherit' }} />
                <button onClick={addNote} style={{ background:T.amber, color:'#fff', border:'none', borderRadius:10, padding:'8px 14px', fontSize:13, fontWeight:700, cursor:'pointer' }}>+</button>
              </div>
            </div>
          )}

          <div style={{ padding:'10px 14px 14px', borderTop:`1px solid ${T.border}`, flexShrink:0, display:'flex', flexDirection:'column', gap:8 }}>
            <button onClick={shareForClaude} style={{
              width:'100%', background: copiedAI ? '#EFEDF7' : T.purple, color: copiedAI ? T.purple : '#fff',
              border:`1px solid ${T.purple}`, borderRadius:12, padding:'10px',
              fontSize:13, fontWeight:700, cursor:'pointer', transition:'all .2s'
            }}>{copiedAI ? '✓ Copied — paste into Claude!' : '🤖 Export for Claude'}</button>
            <button onClick={share} style={{
              width:'100%', background: copied ? T.greenBg : T.ink, color: copied ? T.green : '#fff',
              border:`1px solid ${copied ? T.greenMid : T.ink}`, borderRadius:12, padding:'10px',
              fontSize:13, fontWeight:700, cursor:'pointer', transition:'all .2s'
            }}>{copied ? '✓ Copied!' : '📋 Export session'}</button>
          </div>
        </div>
      )}
    </>
  );
};


// Inject OurList into App
const AppWithList = () => (
  <>
    <App />
    <OurList />
  </>
);

ReactDOM.createRoot(document.getElementById('root')).render(<AppWithList />);
</script>
</body>
</html>
